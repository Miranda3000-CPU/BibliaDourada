name: Build APK and publish download

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'APK não encontrado.' >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Dourada-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish APK to Biblia-Dourada repository
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'Secret SITE_REPO_TOKEN não configurado.' >&2
            exit 1
          fi

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Miranda3000-CPU/Biblia-Dourada.git" site

          mkdir -p site/downloads
          cp "$APK_PATH" site/downloads/Biblia-Dourada.apk

          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add downloads/Biblia-Dourada.apk

          if git diff --cached --quiet; then
            echo 'Nenhuma alteração no APK.'
            exit 0
          fi

          git commit -m "build: atualizar APK do Biblia Dourada"
          git push origin HEAD:main
