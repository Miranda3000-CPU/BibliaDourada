name: Build APK and publish download

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature and generate checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo 'APK não encontrado.' >&2; exit 1; fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print toupper($1)}')
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}')
          mkdir -p app/build/release-metadata
          printf 'SHA-256: %s\n' "$SHA256" > app/build/release-metadata/APK-SHA256.txt
          printf 'Variante: Debug\nAssinatura: APK assinado pelo Android Gradle Plugin\nCertificado SHA-256: %s\n' "$CERT_SHA256" > app/build/release-metadata/APK-STATUS.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "APK verificado: $APK"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'APK não encontrado.' >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Dourada-APK
          path: |
            ${{ steps.apk.outputs.path }}
            app/build/release-metadata/APK-SHA256.txt
            app/build/release-metadata/APK-STATUS.txt
          retention-days: 30

      - name: Publish APK to Biblia-Dourada repository
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'Secret SITE_REPO_TOKEN não configurado.' >&2
            exit 1
          fi

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Miranda3000-CPU/Biblia-Dourada.git" site

          mkdir -p site/downloads
          cp "$APK_PATH" site/downloads/Biblia-Dourada.apk
          cp app/build/release-metadata/APK-SHA256.txt site/downloads/APK-SHA256.txt
          cp app/build/release-metadata/APK-STATUS.txt site/downloads/APK-STATUS.txt

          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add downloads/Biblia-Dourada.apk downloads/APK-SHA256.txt downloads/APK-STATUS.txt

          if git diff --cached --quiet; then
            echo 'Nenhuma alteração no APK.'
            exit 0
          fi

          git commit -m "build: atualizar APK do Biblia Dourada"
          git push origin HEAD:main
